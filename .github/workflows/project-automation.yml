name: Project Automation
on:
  schedule:
    # 4x daily
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Log what would change without writing to the boards'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: project-automation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile release boards
    runs-on: ubuntu-latest
    environment: project-automation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PROJECT_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.PROJECT_AUTOMATION_KEY }}
          owner: jellyfin

      - name: Reconcile project boards
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: python3 .github/scripts/project_automation.py
