name: 'Project Automation'
description: 'Move pull requests and issues between Jellyfin GitHub Projects v2 release boards.'
author: 'Jellyfin'

branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  github-token:
    description: 'Token with repo and project scopes (the org GH_PROJECTS_TOKEN).'
    required: true
  repo:
    description: 'Repository name (e.g. jellyfin or jellyfin-web).'
    required: true
  event-name:
    description: 'The GitHub event that triggered the workflow.'
    required: true
  base-ref:
    description: 'The PR base branch (e.g. master or release-12.z).'
    required: true
  pr-number:
    description: 'The pull request number.'
    required: true
  pr-merged:
    description: 'Whether the pull request was merged.'
    required: false
    default: 'false'
  required-approvals:
    description: 'Number of distinct approving reviewers needed to move a PR to Approved.'
    required: false
    default: '2'

runs:
  using: 'composite'
  steps:
    - name: Run project automation
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        EVENT_NAME: ${{ inputs.event-name }}
        BASE_REF: ${{ inputs.base-ref }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PR_MERGED: ${{ inputs.pr-merged }}
        REQUIRED_APPROVALS: ${{ inputs.required-approvals }}
      run: python3 "${{ github.action_path }}/project_automation.py"
